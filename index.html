<!DOCTYPE html>
<html>
<head><title>WebSim AI History Bot</title><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#111;color:#fff}#chat{max-width:800px;margin:0 auto;background:#222;border-radius:10px;padding:20px}#messages{height:400px;overflow-y:auto;border:1px solid #444;padding:10px;margin-bottom:10px;background:#333}#input{width:calc(100% - 120px);padding:10px;border:1px solid #444;background:#555;color:#fff;border-radius:5px}#send,#speak{padding:10px 15px;margin-left:5px;border:none;background:#007bff;color:#fff;border-radius:5px;cursor:pointer}#speak{background:#28a745}.message{margin:10px 0;padding:10px;border-radius:5px}.user{background:#007bff;text-align:right}.bot{background:#444}.meta{font-size:0.8em;color:#aaa;margin-top:5px}#status{text-align:center;padding:10px;background:#333;border-radius:5px;margin-top:10px}</style></head>
<body>
<div id="chat">
<div id="messages"></div>
<div id="status">🤖 AI Auto-Analyzing WebSim Projects...</div>
<input id="input" placeholder="Ask me about WebSim prompt history..." />
<button id="send">Send</button>
<button id="speak">🔊</button>
</div>
<script>
const chat=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),speak=document.getElementById('speak'),s=speechSynthesis;
let history=[],speaking=false,currentProject,analysisIndex=0;

const addMessage=(text,type,meta)=>{
const div=document.createElement('div');
div.className=`message ${type}`;
div.innerHTML=`${text}${meta?`<div class="meta">${meta}</div>`:''}`;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
};

const speakText=text=>{
if(speaking){s.cancel();speaking=false;return}
const chunks=text.length<=200?[text]:(text.match(/[^.!?\n\r]+[.!?\n\r]*|[^.!?\n\r]+/g)||[]).reduce((a,w)=>{
let h=w.trim();while(h.length>200){const d=h.lastIndexOf(' ',200)>-1?h.lastIndexOf(' ',200):200;a.push(h.substring(0,d));h=h.substring(d).trim()}
h&&a.push(h);return a},[]);
let i=0;speaking=true;status.textContent='🔊 Speaking...';
const playNext=()=>{
if(!speaking||i>=chunks.length){speaking=false;status.textContent='🤖 AI Auto-Analyzing WebSim Projects...';setTimeout(autoAnalyze,2000);return}
const u=new SpeechSynthesisUtterance(chunks[i]);
u.rate=0.9;u.pitch=1;u.volume=0.8;u.onend=()=>{i++;playNext()};u.onerror=()=>{speaking=false;status.textContent='🤖 AI Auto-Analyzing WebSim Projects...';setTimeout(autoAnalyze,2000)};
s.speak(u)};
playNext()};

const searchProjects=async(query,limit=10)=>{
try{
const response=await fetch(`/api/v1/feed/search/best/${encodeURIComponent(query)}?limit=${limit}`);
return await response.json();
}catch(e){return{feed:{data:[]}}}
};

const getProjectDetails=async(id)=>{
try{
const response=await fetch(`/api/v1/projects/${id}`);
return await response.json();
}catch(e){return null}
};

const getUserProjects=async(username,limit=20)=>{
try{
const response=await fetch(`/api/v1/users/${username}/projects?limit=${limit}&posted=true`);
return await response.json();
}catch(e){return{projects:{data:[]}}}
};

const generateResponse=async(userInput)=>{
const systemPrompt=`You are WebSim AI, an expert on WebSim prompt history and project creation. You can search through projects, analyze prompts, and discuss the evolution of ideas on WebSim. You have access to project metadata, user information, and can provide insights about prompt patterns, popular themes, and creative techniques.

Current project: ${currentProject?.title||'Unknown'}
Context: You're helping users explore and understand WebSim's creative ecosystem.

When discussing projects, mention relevant details like creation dates, user creators, view counts, and how prompts evolved. Be conversational and insightful.`;

try{
const searchResults=await searchProjects(userInput,5);
const contextData=searchResults.feed?.data?.slice(0,3)||[];
const context=contextData.map(item=>`Project: ${item.project?.title||'Untitled'} by @${item.project?.created_by?.username||'Unknown'} - ${item.site?.prompt?.text?.substring(0,200)||'No prompt available'}...`).join('\n');

history.push({role:'user',content:userInput});
const completion=await websim.chat.completions.create({
messages:[
{role:'system',content:`${systemPrompt}\n\nRecent relevant projects:\n${context}`},
...history.slice(-10)
]});

const botResponse=completion.content;
history.push({role:'assistant',content:botResponse});
return botResponse;
}catch(e){
return "I'm having trouble accessing WebSim data right now. Try asking about specific projects or creators!";
}};

const autoAnalyze=async()=>{
if(speaking)return;
status.textContent='🔍 Analyzing...';

const topics=['games','ai','art','music','tools','creative','interactive','simulation','3d','animation'];
const topic=topics[analysisIndex%topics.length];
analysisIndex++;

try{
const searchResults=await searchProjects(topic,5);
const projects=searchResults.feed?.data||[];

if(projects.length>0){
const project=projects[Math.floor(Math.random()*projects.length)];
const analysis=await generateAnalysis(project,topic);
addMessage(analysis,'bot');
speakText(analysis);
}else{
const fallback=`Exploring ${topic} projects on WebSim reveals fascinating patterns in creativity and innovation. The community continues to push boundaries with each new creation.`;
addMessage(fallback,'bot');
speakText(fallback);
}
}catch(e){
const fallback=`Continuing my analysis of WebSim's creative ecosystem. The platform showcases incredible diversity in prompt engineering and creative expression.`;
addMessage(fallback,'bot');
speakText(fallback);
}
};

const generateAnalysis=async(project,topic)=>{
const prompt=`Analyze this WebSim project in the ${topic} category: "${project.project?.title||'Untitled'}" by @${project.project?.created_by?.username||'Unknown'}. 

Views: ${project.views||0}, Likes: ${project.likes||0}
Prompt: ${project.site?.prompt?.text?.substring(0,300)||'No prompt available'}

Provide a 2-3 sentence analysis of the creative approach, technical implementation, or community impact. Be conversational and insightful.`;

history=[{role:'user',content:prompt}];
const completion=await websim.chat.completions.create({
messages:[
{role:'system',content:'You are WebSim AI, analyzing creative projects. Be concise, insightful, and conversational.'},
...history
]});

return completion.content;
};

const handleSend=async()=>{
const userInput=input.value.trim();
if(!userInput)return;

addMessage(userInput,'user');
input.value='';

const botResponse=await generateResponse(userInput);
addMessage(botResponse,'bot');
};

const init=async()=>{
try{
currentProject=await websim?.getCurrentProject();
const welcome=`Welcome to WebSim AI Auto-Analysis! I'm continuously exploring prompt history and project evolution. Currently analyzing: ${currentProject?.title||'Unknown project'}. Let me start by examining some fascinating projects...`;
addMessage(welcome,'bot');
speakText(welcome);
}catch(e){
const welcome="Welcome to WebSim AI Auto-Analysis! I'm continuously exploring prompt history, project trends, and creative patterns across the platform.";
addMessage(welcome,'bot');
speakText(welcome);
}};

send.onclick=handleSend;
speak.onclick=()=>speakText(chat.lastElementChild?.textContent||'');
input.onkeypress=e=>e.key==='Enter'&&handleSend();
addEventListener('visibilitychange',()=>document.hidden&&speaking&&(s.cancel(),speaking=false,status.textContent='🤖 AI Auto-Analyzing WebSim Projects...'));

init();
</script>

</body>
</html>
